name: Build & Deploy to Cloudflare Pages

# Publica https://grupomizar.com.co en Cloudflare Pages (proyecto "grupomizar").
#  - push a main que toque site/** o .claude/cloudflare/**  -> compila y publica
#  - Strapi publica un artículo (webhook)                    -> repository_dispatch "strapi-publish" -> compila y publica
#  - Manual (Actions -> Run workflow)                        -> compila y publica
#
# Los artículos del blog viven como archivos en site/src/content/blog/ (guía en su README.md).
# Strapi es OPCIONAL: si responde al compilar, sus artículos se suman (el archivo gana si el slug
# se repite); si no responde, el deploy sigue con los archivos. Para no publicar nunca menos
# artículos de los que ya están en línea, "Verificar el build" compara con el sitemap publicado.
#
# Secrets del repo (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  token de Cloudflare con el permiso "Cloudflare Pages: Edit"
#   STRAPI_URL            https://cms.grupomizar.com.co
# Variable (opcional):    PUBLIC_GA4_ID
#
# Vista previa de borradores (botón «Previsualización» de Strapi): Cloudflare Pages Function en
# site/functions/vista-previa/ — solo atiende /vista-previa/* (.claude/cloudflare/_routes.json).
# Sus variables NO van aquí, van en Cloudflare (Pages -> grupomizar -> Configuración ->
# Variables y secretos, entorno Production): PREVIEW_SECRET, STRAPI_URL, STRAPI_PREVIEW_TOKEN.
#
# Hostinger (deploy.yml) queda como respaldo.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.claude/cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
  repository_dispatch:
    types: [strapi-publish]
  workflow_dispatch:

# Un solo deploy a la vez; si llega otro, espera (nunca se cancela uno a medias).
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://grupomizar.com.co
  CLOUDFLARE_ACCOUNT_ID: 234925b30e7a81da84715ab12edeb906

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      # Strapi ya no bloquea el deploy: los artículos están en el repo. Solo informa.
      - name: Comprobar Strapi (opcional)
        env:
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
        run: |
          if [ -z "$STRAPI_URL" ]; then
            echo "::warning::El secret STRAPI_URL no está definido: se publica solo con los artículos del repo (site/src/content/blog)."
            exit 0
          fi
          URL="${STRAPI_URL%/}/api/posts?pagination[pageSize]=1"
          CODE=$(curl -g -s -o strapi-check.json -m 30 --retry 2 --retry-delay 5 --retry-all-errors -w '%{http_code}' "$URL" || true)
          echo "Strapi /api/posts -> $CODE"
          if [ "$CODE" = "200" ]; then
            TOTAL=$(jq -r '.meta.pagination.total // 0' strapi-check.json 2>/dev/null || echo 0)
            echo "Artículos publicados en Strapi: $TOTAL"
          else
            echo "::warning::Strapi no respondió 200 (respondió '$CODE'). Se continúa solo con los artículos del repo."
          fi

      # Copia del sitemap publicado ANTES de desplegar: IndexNow solo avisa de lo que cambió.
      - name: Guardar el sitemap publicado
        run: |
          curl -s -m 30 --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/sitemap-live.xml" "$SITE_URL/sitemap-0.xml" || : > "$RUNNER_TEMP/sitemap-live.xml"
          echo "URLs en el sitemap publicado: $(grep -o "<loc>" "$RUNNER_TEMP/sitemap-live.xml" | wc -l)"

      - name: Build
        run: npm run build
        working-directory: site
        env:
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}

      - name: Verificar el build
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          for f in index.html .htaccess parcelas-charta/index.html links/index.html blog/index.html sitemap-index.xml 404.html vista-previa/blog/index.html; do
            test -s "site/dist/$f" || { echo "::error::Falta site/dist/$f"; exit 1; }
          done
          N=$(find site/dist -name '*.html' | wc -l)
          echo "Páginas HTML: $N"
          [ "$N" -ge 15 ] || { echo "::error::Solo $N páginas HTML (se esperaban >=15)"; exit 1; }
          # Nunca publicar menos artículos de los que ya están en línea.
          P=$(find site/dist/blog -mindepth 2 -name index.html | wc -l)
          LIVE=$(curl -s -m 30 --retry 3 --retry-delay 5 "$SITE_URL/sitemap-0.xml" | grep -c '/blog/[^<]*/</loc>' || true)
          echo "Páginas de artículos construidas: $P · artículos en línea: ${LIVE:-0}"
          if [ "$P" -lt "${LIVE:-0}" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::El build tiene $P artículos y el sitio publicado tiene $LIVE. No se publica para no quitar artículos. Si retiraste alguno a propósito, ejecuta el workflow a mano (Run workflow)."
            exit 1
          fi
          # El índice del blog debe listar todos los artículos construidos.
          L=$(grep -o 'href="/blog/[^"]*/"' site/dist/blog/index.html | sort -u | wc -l)
          [ "$L" -ge "$P" ] || { echo "::error::El índice del blog lista $L artículos y hay $P páginas"; exit 1; }

      - name: Preparar carpeta de publicación
        run: |
          rm -rf publish
          cp -r site/dist publish
          rm -f publish/.htaccess
          cp .claude/cloudflare/_redirects publish/_redirects
          cp .claude/cloudflare/_headers publish/_headers
          # Solo /vista-previa/* pasa por la Function; todo lo demás se sirve estático.
          cp .claude/cloudflare/_routes.json publish/_routes.json

      # Se lanza desde site/ para que wrangler encuentre y empaquete site/functions/.
      - name: Publicar en Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 pages deploy ../publish \
            --project-name grupomizar \
            --branch main \
            --commit-hash "${{ github.sha }}" \
            --commit-dirty=true

      - name: Comprobar el sitio publicado
        run: |
          sleep 10
          FAIL=0
          for p in / /parcelas-charta/ /links/ /nosotros/ /proyectos/ /blog/ /sitemap-index.xml; do
            code=$(curl -s -o /dev/null -m 30 --retry 3 --retry-delay 5 -w '%{http_code}' "$SITE_URL$p")
            echo "$p -> $code"
            [ "$code" = 200 ] || FAIL=1
          done
          # La vista previa sin firma debe rechazarse (401; 503 si aún faltan sus variables).
          # Un 200 significaría que la Function no se publicó y se ve la plantilla vacía.
          # Sin --retry: curl reintenta los 503 y termina con error aunque la respuesta sea la esperada.
          code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$SITE_URL/vista-previa/blog/" || true)
          echo "/vista-previa/blog/ (sin firma) -> $code"
          case "$code" in 401|503) ;; *) echo "::error::/vista-previa/blog/ respondió $code (se esperaba 401 o 503)"; FAIL=1 ;; esac
          exit $FAIL

      # Bing alimenta la búsqueda de ChatGPT y Copilot: avisarle SOLO de lo que cambió en este deploy
      # (URLs nuevas, lastmod distinto, o páginas de artículos cuyo .md cambió; ver .claude/indexnow-urls.sh).
      # Un cambio en site/ que no sea un artículo avisa de todo el sitemap (comportamiento anterior).
      - name: Avisar a IndexNow
        if: success()
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          CHANGES=NONE
          if [ "$EVENT_NAME" = push ]; then
            CHANGES=ALL
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null \
               && git diff --name-only "$BEFORE" "$SHA" > "$RUNNER_TEMP/changed.txt"; then
              CHANGES="$RUNNER_TEMP/changed.txt"
              echo "Archivos cambiados en el push:"; cat "$CHANGES"
            else
              echo "No se pudo comparar con el push anterior: se avisa de todo el sitemap."
            fi
          fi
          mapfile -t URLS < <(bash "$GITHUB_WORKSPACE/.claude/indexnow-urls.sh" "$RUNNER_TEMP/sitemap-live.xml" "$GITHUB_WORKSPACE/site/dist/sitemap-0.xml" "$CHANGES")
          if [ "${#URLS[@]}" -eq 0 ]; then
            echo "Ninguna URL cambió: no se avisa a IndexNow."
            exit 0
          fi
          echo "Se avisan ${#URLS[@]} URL(s):"
          printf '  %s\n' "${URLS[@]}"
          bash "$GITHUB_WORKSPACE/.claude/indexnow.sh" "${URLS[@]}" || echo "::warning::No se pudo avisar a IndexNow"
