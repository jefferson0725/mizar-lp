name: Build & Deploy to Cloudflare Pages

# Publica https://grupomizar.com.co en Cloudflare Pages (proyecto "grupomizar").
#  - push a main que toque site/** o .claude/cloudflare/**  -> compila y publica
#  - Strapi publica un artículo (webhook)                    -> repository_dispatch "strapi-publish" -> compila y publica
#  - Manual (Actions -> Run workflow)                        -> compila y publica
#
# Los artículos del blog se leen de Strapi al compilar. Si Strapi no responde, el sitio se
# compilaría con el blog VACÍO: por eso hay una comprobación previa que aborta el deploy.
#
# Secrets del repo (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  token de Cloudflare con el permiso "Cloudflare Pages: Edit"
#   STRAPI_URL            https://cms.grupomizar.com.co
# Variable (opcional):    PUBLIC_GA4_ID
#
# Hostinger (deploy.yml) queda como respaldo.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.claude/cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
  repository_dispatch:
    types: [strapi-publish]
  workflow_dispatch:

# Un solo deploy a la vez; si llega otro, espera (nunca se cancela uno a medias).
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://grupomizar.com.co
  CLOUDFLARE_ACCOUNT_ID: 234925b30e7a81da84715ab12edeb906

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Comprobar que Strapi responde (no publicar un blog vacío)
        id: strapi
        env:
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$STRAPI_URL" ]; then
            echo "::error::El secret STRAPI_URL está vacío o no existe. Se cancela el deploy para no publicar el blog vacío."
            exit 1
          fi
          URL="${STRAPI_URL%/}/api/posts?pagination[pageSize]=1"
          CODE=$(curl -g -s -o strapi-check.json -m 30 --retry 3 --retry-delay 10 --retry-all-errors -w '%{http_code}' "$URL" || true)
          echo "Strapi /api/posts -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Strapi no respondió 200 (respondió '$CODE'). Se cancela el deploy para no publicar el blog vacío. Revisa que el CMS esté arriba."
            exit 1
          fi
          TOTAL=$(jq -r '.meta.pagination.total // 0' strapi-check.json 2>/dev/null || echo 0)
          echo "Artículos publicados en Strapi: $TOTAL"
          STRAPI_TOTAL="$TOTAL"
          # Comparar con el sitio publicado: si Strapi dice 0 pero el sitio ya tiene artículos, algo falló.
          LIVE=$(curl -s "$SITE_URL/sitemap-0.xml" | grep -c '/blog/[^<]*/</loc>' || true)
          echo "Artículos en el sitio publicado: $LIVE"
          if [ "$STRAPI_TOTAL" -eq 0 ] && [ "${LIVE:-0}" -gt 0 ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::Strapi devuelve 0 artículos pero el sitio publicado tiene $LIVE. No se publica para no vaciar el blog. Si de verdad se retiraron todos, ejecuta el workflow a mano."
            exit 1
          fi
          echo "total=$STRAPI_TOTAL" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        working-directory: site
        env:
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}

      - name: Verificar el build
        env:
          STRAPI_TOTAL: ${{ steps.strapi.outputs.total }}
        run: |
          for f in index.html .htaccess parcelas-charta/index.html links/index.html blog/index.html sitemap-index.xml 404.html; do
            test -s "site/dist/$f" || { echo "::error::Falta site/dist/$f"; exit 1; }
          done
          N=$(find site/dist -name '*.html' | wc -l)
          echo "Páginas HTML: $N"
          [ "$N" -ge 15 ] || { echo "::error::Solo $N páginas HTML (se esperaban >=15)"; exit 1; }
          # Si Strapi tiene artículos, el build debe haber generado sus páginas (si no, el blog salió vacío).
          STRAPI_TOTAL="${STRAPI_TOTAL:-0}"
          P=$(find site/dist/blog -mindepth 2 -name index.html | wc -l)
          echo "Páginas de artículos: $P (Strapi: $STRAPI_TOTAL)"
          [ "$P" -ge "$STRAPI_TOTAL" ] || { echo "::error::Strapi tiene $STRAPI_TOTAL artículos pero el build solo generó $P. Se cancela el deploy."; exit 1; }
          # El índice del blog debe listar todos los artículos construidos.
          L=$(grep -o 'href="/blog/[^"]*/"' site/dist/blog/index.html | sort -u | wc -l)
          [ "$L" -ge "$P" ] || { echo "::error::El índice del blog lista $L artículos y hay $P páginas"; exit 1; }

      - name: Preparar carpeta de publicación
        run: |
          rm -rf publish
          cp -r site/dist publish
          rm -f publish/.htaccess
          cp .claude/cloudflare/_redirects publish/_redirects
          cp .claude/cloudflare/_headers publish/_headers

      - name: Publicar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 pages deploy publish \
            --project-name grupomizar \
            --branch main \
            --commit-hash "${{ github.sha }}" \
            --commit-dirty=true

      - name: Comprobar el sitio publicado
        run: |
          sleep 10
          FAIL=0
          for p in / /parcelas-charta/ /links/ /nosotros/ /proyectos/ /blog/ /sitemap-index.xml; do
            code=$(curl -s -o /dev/null -m 30 --retry 3 --retry-delay 5 -w '%{http_code}' "$SITE_URL$p")
            echo "$p -> $code"
            [ "$code" = 200 ] || FAIL=1
          done
          exit $FAIL

      # Bing alimenta la búsqueda de ChatGPT y Copilot: avisarle que el sitio cambió.
      - name: Avisar a IndexNow
        if: success()
        run: bash "$GITHUB_WORKSPACE/.claude/indexnow.sh" || echo "::warning::No se pudo avisar a IndexNow"
